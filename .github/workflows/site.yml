# Builds the website (./gradlew assembleSite) and publishes it on the gh-pages branch, which GitHub
# Pages serves at https://rizqtekv.github.io/bonedle/ (gradle.properties `bonedle.siteUrl`).
# The daily run publishes the next day's board images, never later ones (web/README.md).
name: Website

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the site
        run: ./gradlew assembleSite --console=plain
      - name: Publish to gh-pages
        working-directory: build/site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
