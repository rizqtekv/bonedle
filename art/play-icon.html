<!doctype html>
<!-- Renders the 512 x 512 Play Store icon from icon.svg, cropped closer than the launcher icon
     (Play masks the square itself; no safe zone needed). See art/README.md. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0B111C}img{display:block;width:512px;height:512px;object-fit:cover;object-position:50% 52%;transform:scale(1.22);transform-origin:50% 52%}div{width:512px;height:512px;overflow:hidden}</style></head>
<body><div><img src="icon.svg" alt=""></div></body></html>
